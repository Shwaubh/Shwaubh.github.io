    <h1>Country Facts Explorer</h1>
    <p class="muted">Get random countries with names, region, capital, and population.</p>
  </header>

  <section class="container section">
    <div class="utility-actions">
      <button id="getCountryButton" class="btn btn-primary" type="button">Load Random Countries</button>
    </div>
    <p id="status" class="muted">Loading country facts...</p>
    <div id="countryContainer" class="list-grid" aria-live="polite"></div>
  </section>

  <footer class="footer">
    <div class="container">Discover one country at a time.</div>
  </footer>
